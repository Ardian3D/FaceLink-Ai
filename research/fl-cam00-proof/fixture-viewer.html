<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FL-CAM01 — Fixture mannequin, bukan orang</title>
<style>body{margin:0;background:#eee;color:#111;font:16px system-ui}header{padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,input{font:inherit}canvas{display:block;margin:auto;max-width:100%;height:calc(100vh - 135px);object-fit:contain;background:white}footer{padding:8px;text-align:center;font-size:12px}</style>
<header><strong>FL-CAM01 · DUMMY, BUKAN ORANG</strong><button data-mode="zero">Nol wajah</button><button data-mode="original">Satu mannequin asli</button><button data-mode="frontal">Satu fixture simetris</button><button data-mode="two">Dua fixture</button><label>Ukuran <input id="size" type="range" min="0.25" max="0.95" step="0.05" value="0.8"></label><label>Geser X <input id="shift" type="range" min="-0.3" max="0.3" step="0.05" value="0"></label></header>
<canvas id="fixture" width="1200" height="900"></canvas><footer>Mannequin CosSchlHead2on112010 — CAMiller62, CC BY-SA 3.0, Wikimedia Commons. Fixture simetris: turunan refleksi separuh kepala; bukan bukti identitas/PAD. Penanda L/R untuk uji mirror.</footer>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),image=new Image(),size=document.querySelector('#size'),shift=document.querySelector('#shift');let mode='frontal';
image.src='/mannequin.jpg';image.onload=render;image.onerror=()=>{ctx.fillStyle='black';ctx.fillText('Fixture mannequin.jpg tidak tersedia. Tidak ada fallback wajah orang.',50,80)};
const symmetric=document.createElement('canvas');symmetric.width=560;symmetric.height=700;const s=symmetric.getContext('2d');
function buildSymmetric(){s.fillStyle='white';s.fillRect(0,0,560,700);s.drawImage(image,153,70,280,620,280,0,280,700);s.save();s.translate(560,0);s.scale(-1,1);s.drawImage(image,153,70,280,620,280,0,280,700);s.restore()}
function render(){ctx.fillStyle='white';ctx.fillRect(0,0,1200,900);ctx.font='bold 48px system-ui';ctx.fillStyle='#000';ctx.fillText('L',20,75);ctx.fillText('R',1130,75);ctx.fillStyle='#246';ctx.fillRect(20,105,70,70);ctx.fillStyle='#c62';ctx.fillRect(1110,105,70,70);if(!image.complete||!image.naturalWidth)return;if(mode==='zero')return;buildSymmetric();const h=Number(size.value)*850,w=h*0.8,y=(900-h)/2,dx=Number(shift.value)*1200;if(mode==='original'){ctx.drawImage(image,600-w/2+dx,y,w,h)}else if(mode==='frontal'){ctx.drawImage(symmetric,600-w/2+dx,y,w,h)}else{const tw=Math.min(w,460),th=tw/0.8;ctx.drawImage(symmetric,50+dx,(900-th)/2,tw,th);ctx.drawImage(symmetric,690+dx,(900-th)/2,tw,th)}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});size.oninput=render;shift.oninput=render;render();
</script></html>
